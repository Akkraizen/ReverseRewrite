[project]
name = "reverserewrite"
version = "0.1.0"
description = "The rewrote version of my first programm - Bot with name Reverse, which made for my own discord server."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "hikari>=2.6.0",
    "hikari-arc>=2.3.2",
    "loguru (>=0.7.3,<0.8.0)",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.1",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "ANN"]
# User-facing strings are in Russian.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401"]

[tool.pyright]
include = ["reverse", "migrations", "tests"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportImplicitOverride = "error"
